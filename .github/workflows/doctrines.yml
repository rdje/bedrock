name: doctrines
# E4 enforcement: the SAME doctrine enforcer the pre-commit hook runs, so a locally
# --no-verify'd commit still fails here — plus the enforcer's OWN tests, so a regression in a
# check is caught by CI and not by whoever remembers to run --self-test by hand (BK-19).
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: doctrines-${{ github.ref }}
  cancel-in-progress: true

jobs:
  enforce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (pinned by commit)
        with:
          fetch-depth: 0
      - name: Refuse an uninitialised copy of the template
        # A repository created from the template but never bootstrapped still carries MAINTAINING.md
        # and believes it is bedrock (BK-18). The template repository itself, and forks of it that keep
        # its name, are exempt.
        if: github.event.repository.name != 'bedrock'
        run: |
          if [ -f MAINTAINING.md ]; then
            echo "::error::This repository was created from the bedrock template but never initialised. Run  scripts/bootstrap.sh <project-name>  and commit the result."
            exit 1
          fi
      - name: Run the doctrine enforcer on every commit this event introduces
        # Each commit is judged against its parent with its real message (BR-04). A push to a
        # new branch, or a manual run, has no known base: the driver then judges the tip only.
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          TIP: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/check_doctrines.sh --range "$BASE..$TIP"

  enforcer-selftest:
    # The enforcer judging itself: every check's --self-test, both probe drivers, a syntax pass
    # over every script, shellcheck, and the conformance suite that builds children (no pack, each
    # pack, each harness) and runs the review's scenarios against the tree under test — on Linux
    # AND macOS, because macOS (stock bash 3.2, BSD sed and awk) is where GNU-only assumptions break.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (pinned by commit)
        with:
          fetch-depth: 0
      - name: Syntax — every shell script parses
        run: |
          set -e
          for f in $(git ls-files '*.sh') .githooks/pre-commit .githooks/commit-msg; do bash -n "$f"; done
          echo "bash -n: $(git ls-files '*.sh' | wc -l) scripts + 2 hooks parse"
      - name: Each check's --self-test
        run: |
          set -e
          for c in scripts/check_gap_claims.sh scripts/check_lesson_promotion.sh scripts/check_live_doc_currency.sh scripts/check_routing_evidence.sh scripts/check_table_arity.sh; do
            bash "$c" --self-test
          done
      - name: Probe drivers
        run: |
          set -e
          bash docs/tasks/artifacts/task_acceptance/run_task_acceptance_probes.sh
          bash docs/tasks/artifacts/waiver_routing/run_waiver_routing_probes.sh
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch, pinned by commit
        with:                                                                   # the Rust pack's arm runs cargo in a generated child
          toolchain: stable
          components: rustfmt, clippy
      - name: Conformance suite (the review's scenarios against this tree)
        run: |
          git config --global user.email ci@example.invalid
          git config --global user.name ci
          bash scripts/tests/spine_tests.sh
      - name: shellcheck — errors block
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y -qq shellcheck >/dev/null
          shellcheck --version | head -2
          shellcheck -S error $(git ls-files '*.sh') .githooks/pre-commit .githooks/commit-msg
      - name: shellcheck — full report (advisory until a baseline is checked in)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: shellcheck -f gcc $(git ls-files '*.sh') .githooks/pre-commit .githooks/commit-msg | grep -oE '\[SC[0-9]+\]' | sort | uniq -c | sort -rn
